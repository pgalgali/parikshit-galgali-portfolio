<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parikshit Galgali - Executive Video Summary</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c18;--bg2:#0c1120;--border:#1a2640;--green:#00d4aa;--text:#e2e8f0;--text2:#94a3b8;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,170,0.012) 2px,rgba(0,212,170,0.012) 4px);pointer-events:none}
.page{min-height:100vh;padding:2rem;display:flex;flex-direction:column;gap:1.25rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-family:var(--mono);font-size:12px;color:var(--text2)}
.brand{color:var(--green);text-decoration:none}
.back{color:var(--text2);text-decoration:none;border:1px solid var(--border);border-radius:4px;padding:9px 14px}
.back:hover{color:var(--green);border-color:var(--green)}
.frame{flex:1;min-height:calc(100vh - 7rem);border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg2)}
iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:760px){.page{padding:1rem}.topbar{align-items:flex-start;flex-direction:column}.frame{min-height:60vh}}
</style>
</head>
<body>
  <main class="page">
    <nav class="topbar">
      <a class="brand" href="./index.html">~/pgalgali/video-summary</a>
      <a class="back" href="./index.html#summary">back to profile</a>
    </nav>
    <section class="frame" aria-label="Executive video summary">
      <iframe src="./video-summary/index.html?embed=1&preview=1" title="Parikshit Galgali executive video summary" allow="autoplay"></iframe>
    </section>
  </main>
</body>
</html>
